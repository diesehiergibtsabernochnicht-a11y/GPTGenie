name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify GitHub Pages project-subpath build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Upload Goodnotes smoke-test notebook
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gptgenie-goodnotes-smoke-test
          path: artifacts/*.goodnotes
          if-no-files-found: error
          retention-days: 7
